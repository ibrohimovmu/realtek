name: ar_shooter
description: AR shooter, local storage + WiFi multiplayer
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  permission_handler: ^11.3.1
  audioplayers: ^6.0.0
  google_mlkit_object_detection: ^0.13.0
  google_mlkit_pose_detection: ^0.12.1
  geolocator: ^14.1.2
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#14141F"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
