name: minimal_launcher
description: "Nordic Slate Minimalist Android OS Launcher v4.0 with Autonomous Nova AI (Instagram/Telegram/WhatsApp, Voice Biometric Lock, Custom Wake Phrase, Lock-Screen Unlock), 6-Panel Kinetic Welcome, Music & Calendar Widgets, and Tactical Game Hub."
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/
