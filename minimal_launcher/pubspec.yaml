name: minimal_launcher
description: "Minimalist, animation-rich Android Home Launcher with Nova AI Assistant, Telegram Voice Messaging, Crescent Wheel & Realistic Cat."
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/
