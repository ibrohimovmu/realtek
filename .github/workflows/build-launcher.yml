name: Build Minimal Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Get Dependencies
        working-directory: minimal_launcher
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: minimal_launcher
        run: flutter analyze

      - name: Run Unit Tests
        working-directory: minimal_launcher
        run: flutter test

      - name: Build Universal Release APK
        working-directory: minimal_launcher
        run: flutter build apk --release

      - name: Copy Universal APK
        run: |
          mkdir -p output_launcher_apks
          cp minimal_launcher/build/app/outputs/flutter-apk/app-release.apk output_launcher_apks/MinimalLauncher-v2.0-Universal.apk

      - name: Build Split per ABI APKs
        working-directory: minimal_launcher
        run: flutter build apk --split-per-abi --release

      - name: Copy Split APKs
        run: |
          cp minimal_launcher/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_launcher_apks/MinimalLauncher-v2.0-arm64.apk || true
          cp minimal_launcher/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_launcher_apks/MinimalLauncher-v2.0-armeabi.apk || true
          ls -lh output_launcher_apks

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-v2-APKs
          path: output_launcher_apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: launcher-v2.0.0
          name: "Minimal Launcher v2.0.0 (Yarim Oy, AI Fonlar, Faollik Tarixi & Haqiqiy Mushukcha)"
          body: |
            ## 🌙 Minimal Launcher v2.0.0 — Katta Yangilanish

            Foydalanuvchi talablari asosida tubdan boyitilgan, yarim oy shaklida aylanuvchi va to'liq moslashtiriluvchi (customizable) Android Launcher.

            ### ✨ Yangi imkoniyatlar (v2.0.0):
            - **🌙 Yarim Oy (Crescent Arc) Aylanma Menyu:** Pastdan chiqadigan oyna o'rniga asosiy ekranning o'zida yarim oy shaklida silliq aylanadigan ilovalar g'ildiragi (`Hammasi`, `Asosiy ★`, `Oxirgi 🕒`, `Ko'p kirilgan 🔥` filtrlari va tezkor qidiruv bilan).
            - **🐈‍⬛ Kichikroq va Haqiqiy Qora Mushukcha:** Tabiiy mushuk anatomiyasi, vertikal qorachiqli qahrabo/zumrad/oq ko'zlar, barmoq harakatini kuzatish, o'lchamini va ko'z rangini o'zgartirish imkoniyati.
            - **📊 Faollik va Kirilgan Ilovalar Tarixi Markazi:** Qaysi ilovaga soat nechada kirilganligi (Timeline), eng ko'p ishlatilgan ilovalar statistikasi, ekran vaqti (`UsageStatsManager`), Maxfiy (Incognito) rejim va Yashirin ilovalar ombori.
            - **🎨 4-Bo'limli Shaxsiylashtirish Studiyasi:**
              - **6 xil Kreativ HD Orqa Fon** + **AI Orqa Fon Yaratuvchi** + **Galereyadan rasm tanlash** + **6 xil 60fps Jonli San'at sahnasi**.
              - **6 xil Soat uslubi** (`Minimal Klassik`, `3D Flip Soat`, `Bauhaus Analog`, `Katta Vertikal`, `Kiber HUD`, `Shaffof Kapsula`).
              - **6 xil Ikonka uslubi** (`Qora Doira`, `Muzlatilgan Oyna`, `Neon Halqa`, `Tabiiy Rangli`, `Oq-Qora`, `Faqat Yozuv`).
              - **7 xil Atrof-muhit Effekti** (`Chang`, `Tungi Qo'ng'izlar`, `Sakura`, `Kosmos`, `Qor`, `Matrix`).
          files: output_launcher_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
