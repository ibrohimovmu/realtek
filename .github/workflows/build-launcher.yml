name: Build Minimal Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Get Dependencies
        working-directory: minimal_launcher
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: minimal_launcher
        run: flutter analyze

      - name: Run Unit Tests
        working-directory: minimal_launcher
        run: flutter test

      - name: Build Universal Release APK
        working-directory: minimal_launcher
        run: flutter build apk --release

      - name: Copy Universal APK
        run: |
          mkdir -p output_launcher_apks
          cp minimal_launcher/build/app/outputs/flutter-apk/app-release.apk output_launcher_apks/MinimalLauncher-v4.0-Universal.apk

      - name: Build Split per ABI APKs
        working-directory: minimal_launcher
        run: flutter build apk --split-per-abi --release

      - name: Copy Split APKs
        run: |
          cp minimal_launcher/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_launcher_apks/MinimalLauncher-v4.0-arm64.apk || true
          cp minimal_launcher/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_launcher_apks/MinimalLauncher-v4.0-armeabi.apk || true
          ls -lh output_launcher_apks

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-v4-APKs
          path: output_launcher_apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: launcher-v4.0.0
          name: "Minimal Launcher v4.0.0 (Nordic Slate OS + Autonomous AI + Voice Biometrics + Game Hub + 6-Panel Kinetic Welcome)"
          body: |
            ## ✨ Minimal Launcher v4.0.0 — Nordic Architectural OS & Autonomous AI

            ### 🎨 1. Nordic Slate & Deep Petrol Ranglar Palitrasi (100% Siz Yuborgan Palitra)
            - Robot yoki bachkana ranglardan butunlay voz kechildi: faqat **`#0E1D21`**, **`#122E34`**, **`#283E47`**, **`#677E8A`**, **`#ABAFB5`**, **`#622347`** va **`#E0B4B2`** me'moriy ranglar palitrasi ishlatildi.
            - Yarim oy egriligi olib tashlanib, **tekis, nafis vertikal arxitektura ro'yxati**, silliq kengayuvchi qidiruv paneli (`Morphing Search`) va **Portal / Parda ilova ochilish animatsiyalari** o'rnatildi.
            - Launcher yuklanganda oddiy zoom/fade emas, **6-panelli Kinetik Slate Welcome Parda animatsiyasi** bilan ochiladi.

            ### 🤖 2. To'liq Avtonom Nova AI Assistent (Instagram, Telegram, WhatsApp, Voice Lock & Block Screen)
            - **📸 Instagram, ✈️ Telegram va 💬 WhatsApp Avtonom Yozish (`Live Step-by-Step HUD`):**
              - *"Instagramdan Sardor ga bugun ko'rishamiz deb yoz"* yoki *"Telegramdan Akmal ga 10 daqiqada boraman deb yoz"* desangiz, ekranning tepasida (`Live Agent HUD`) va pastki kapsulada har bir qadamni jonli ko'rsatib, ilovaga kiradi, do'stingizni qidiradi, xabarni yozadi va yuboradi.
            - **🗣️ Shaxsiy Chaqirish Iborasi (`Custom Wake Phrase`):**
              - Assistentni qanday chaqirishni o'zingiz belgilang (*"Hey Nova"*, *"Hey Jarvis"*, *"Salom Bro"* va h.k.).
            - **🔐 Ovoz Biometriyasi (`Faqat Mening Ovozimga Ishlasin`):**
              - 4-o'lchamli akustik spektral ovoz tahlili ($F_0$ pitch, ZCR, spektral energiya) orqali faqat sizning ovozingizni taniydi va begona ovozlarni bloklaydi.
            - **🔓 Block Screen va Avtomatik PIN Ochish:**
              - Qulflangan ekranda ham ishlaydi va sizning ovozingiz tasdiqlanganda PIN-kodni avtomatik terib telefon qulfini ochadi.

            ### 🎮 3. Minimalist Game Hub va O'yin Usti (`In-Game Top Overlay`) Paneli
            - Launcher ichida **Game Hub** konsoli va o'yinga kirganda ekranning eng tepasida chiqib turadigan **`🎮 Game Hub • °C • RAM %`** suzuvchi kapsulasi!
            - Bosganda jonli **Harorat (`°C`)**, **RAM (`MB` va `%`)**, **Batareya (`%`)**, haqiqiy ishlovchi **`⚡ 1-Tap RAM Boost`** (`killBackgroundProcesses`) va **`🔕 Chalg'itmaslik (DND)`** chiqadi.

            ### 🎵 4. Musiqa Pleyeri, Interaktiv Kalendar, Haqiqiy Unsplash Fotolari va Xavfsizlik
            - Bosh ekranda jonli ekvalayzerli **Minimalist Musiqa Pleyeri**, **Oylik Interaktiv Kalendar**, **App Vault PIN qulfi**, va **Unsplash haqiqiy HD fotolar** kutubxonasi.
          files: output_launcher_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
