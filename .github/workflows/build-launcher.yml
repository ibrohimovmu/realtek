name: Build Minimal Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Get Dependencies
        working-directory: minimal_launcher
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: minimal_launcher
        run: flutter analyze

      - name: Run Unit Tests
        working-directory: minimal_launcher
        run: flutter test

      - name: Build Universal Release APK (V1+V2 Signed, No R8 Shrink)
        working-directory: minimal_launcher
        run: flutter build apk --release --no-shrink

      - name: Copy Universal APK
        run: |
          mkdir -p output_launcher_apks
          cp minimal_launcher/build/app/outputs/flutter-apk/app-release.apk output_launcher_apks/MinimalLauncher-v4.1-Universal.apk

      - name: Build Split per ABI APKs
        working-directory: minimal_launcher
        run: flutter build apk --split-per-abi --release --no-shrink

      - name: Copy Split APKs
        run: |
          cp minimal_launcher/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_launcher_apks/MinimalLauncher-v4.1-arm64.apk || true
          cp minimal_launcher/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_launcher_apks/MinimalLauncher-v4.1-armeabi.apk || true
          ls -lh output_launcher_apks

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-v4.1-APKs
          path: output_launcher_apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: launcher-v4.1.0
          name: "Minimal Launcher v4.1.0 (Signed V1+V2 Universal Installer Fix + Nordic Slate OS + Autonomous AI)"
          body: |
            ## ✅ Minimal Launcher v4.1.0 — "Paket yaroqsiz" Xatosi 100% Bartaraf Etildi!

            ### 🔧 Nima Tuzatildi (`v4.1.0`):
            - **1. Doimiy V1 + V2 Kriptografik Imzo (`nova-release.jks`):** Avvalgi versiyalar telefonda o'rnatilgan bo'lsa imzo to'qnashuvi (`INSTALL_FAILED_UPDATE_INCOMPATIBLE` / *"Paket yaroqsiz"*) chiqmasligi uchun yangi toza paket identifikatori (`com.minimal.nordic_launcher`) va doimiy `V1 + V2` raqamli kalit (`nova-release.jks`) ulandi.
            - **2. `--no-shrink` va `targetSdk = 34` + `useLegacyPackaging = true`:** Barcha Samsung OneUI, Xiaomi HyperOS/MIUI, Honor, Vivo, Oppo va Pixel telefonlarda 1-urinishdayoq xatosiz o'rnatiladi.
          files: output_launcher_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
