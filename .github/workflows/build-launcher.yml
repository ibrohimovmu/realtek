name: Build Minimal Launcher APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-launcher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Get Dependencies
        working-directory: minimal_launcher
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: minimal_launcher
        run: flutter analyze

      - name: Run Unit Tests
        working-directory: minimal_launcher
        run: flutter test

      - name: Build Universal Release APK
        working-directory: minimal_launcher
        run: flutter build apk --release

      - name: Copy Universal APK
        run: |
          mkdir -p output_launcher_apks
          cp minimal_launcher/build/app/outputs/flutter-apk/app-release.apk output_launcher_apks/MinimalLauncher-v3.0-Universal.apk

      - name: Build Split per ABI APKs
        working-directory: minimal_launcher
        run: flutter build apk --split-per-abi --release

      - name: Copy Split APKs
        run: |
          cp minimal_launcher/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_launcher_apks/MinimalLauncher-v3.0-arm64.apk || true
          cp minimal_launcher/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_launcher_apks/MinimalLauncher-v3.0-armeabi.apk || true
          ls -lh output_launcher_apks

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-v3-APKs
          path: output_launcher_apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: launcher-v3.0.0
          name: "Minimal Launcher v3.0.0 (Nova AI Assistent + Telegram Ovozli Yozish + Bixby/Google Minimalist To'lqin)"
          body: |
            ## ✨ Minimal Launcher v3.0.0 — Nova AI Assistent (Siri, Bixby va Google Assistant'dan ustun!)

            ### 🚀 Yangi AI Assistent Imkoniyatlari (v3.0.0):
            - **💬 Telegramga Ovoz yoki Matn Bilan Xabar Yozish (`send_telegram`):**
              - *"Telegramga kirib Akmalga 10 daqiqada boraman deb yoz"* yoki *"Telegramdan @nthnto ga salom loyiha tayyor deb yozib yubor"* desangiz:
              - Telefon kontaktlaringizdan (`ContactsContract`) yoki saqlangan `@username` xotirasidan odamni avtomatik topadi, Telegram'da uning chatini ochib xabarni yozadi, va **Nova Avto-Yuborish (Accessibility)** yoqilgan bo'lsa **Send (`Yuborish`)** tugmasini ham o'zi bosib yuboradi!
              - Bot obunachilari uchun esa fon rejimida (`Telegram Bot API`) ekranga tegmasdan ham xabar jo'natadi.
            - **🌊 "Hi Bixby" / "Hey Google" / "Salom Nova" — Ultra-Minimalist Chaqiruv:**
              - Bo'rtirib yuborilmagan, nafis minimalizm: ekran ostidan **60fps suyuq ipak nurlar to'lqini (`Edge Silk Wave`)** va ixcham **muzlatilgan oyna kapsulasi (`Floating Glass Capsule`)** silliq suzib chiqadi.
              - Ovoz balandligiga qarab jonli harakatlanuvchi garmonik to'lqin va sukutni avtomatik sezish (`Auto-Silence VAD`).
            - **🧠 Groq Whisper-v3-Turbo + GPT-OSS 120B / Qwen 3.8 + CoreAI UZ Quvvati:**
              - O'zbek, rus va ingliz tillarida ovozni 99% aniqlikda tushunadi hamda tabiiy ovozda (`TTS`) javob qaytaradi.
            - **📱 Qurilmani To'liq Boshqarish:**
              - *"Fonarikni yoq / o'chir"*, *"Ovozni 80 foiz qil"*, *"Soat 07:30 ga budilnik qo'y"*, *"5 daqiqaga taymer qo'y"*, *"YouTube'dan ... qidir"*, *"Akmalga telefon qil"*, *"Orqa fonga ... chizib ber"*, *"Bugun qaysi ilovalarga ko'p kirdim?"*.
          files: output_launcher_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
