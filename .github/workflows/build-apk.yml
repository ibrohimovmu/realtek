name: Build WABI Family & Discipline APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync WABI Web Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build WABI APK (API 26 - API 35)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package APK Files
        run: |
          find android/app/build/outputs -name "*.apk" -exec ls -lh {} +
          APK_PATH=$(find android/app/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Packaging APK from $APK_PATH"
          cp "$APK_PATH" Wabi-v1.0.1.apk
          cp "$APK_PATH" Wabi-Family-v1.0.1.apk
          cp "$APK_PATH" Wabi-Discipline.apk

      - name: Upload Wabi-v1.0.1.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wabi-v1.0.1-APK
          path: |
            Wabi-v1.0.1.apk
            Wabi-Family-v1.0.1.apk
            Wabi-Discipline.apk
          retention-days: 30

      - name: Publish v1.0.1 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: wabi-v1.0.1
          name: "WABI v1.0.1 — Oila & Intizom (Smart Family Discipline)"
          make_latest: true
          body: |
            ## 🌟 WABI v1.0.1 (`Wabi-v1.0.1.apk`)

            Ota-ona va farzandlar uchun "Oila & Intizom" (Smart Discipline & Focus Ecosystem) — 100% Realtime & Offline Assets:

            ### ✨ Asosiy Imkoniyatlar:
            - 🚀 **`file:///android_asset/www/index.html`** orqali to'g'ridan-to'g'ri ishonchli yuklanish (Net errorlari yo'q).
            - 🔮 **"Meet Wabi" Liquid Glass Lens Swipe:** WebGL qavariq shisha linzasi, ranglar sinishi (Chromatic Aberration) va 35 ta 2D fizika pufakchalari otilib chiqishi.
            - 🧸 **"What's Your Vibe Today?" 3D Paxmoq Personaj:** 3,500 ta procedural fur shell rendering, kayfiyatga qarab yashil/olovrang/qizil rangga va ko'z morfingiga ega.
            - 📖 **Tarbiya Ensiklopediyasi:** 5 ta katta kategoriya, 40+ to'liq psixologik tahlillar va hayotiy vaziyatlar.
            - 🤝 **Dardkash:** Hissiy AI do'st va maslahatchi.
            - 👑 **Dual Role Tizimi:** Ota-ona (Parent) va Farzand (Kid) rejimlari 6 xonali oila kodi orqali real vaqtda bog'lanadi.
            - 🛡️ **Haqiqiy Android Nazorati:** `UsageStatsManager` va `AccessibilityService` orqali Instagram/o'yinlar 10-daqiqa limiti tugashi bilan "Warm Espresso Focus Lock" ekrani bilan bloklash.
            - 🕌 **Namangan Namoz Vaqtlari:** Aladhan API va tizim `AlarmClock` orqali 5 mahal namozga avtomatik budilnik qo'yish.
          files: |
            Wabi-v1.0.1.apk
            Wabi-Family-v1.0.1.apk
            Wabi-Discipline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
