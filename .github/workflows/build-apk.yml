name: Build WABI Family & Discipline APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync WABI Web Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build WABI APK (API 26 - API 35)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package APK Files
        run: |
          find android/app/build/outputs -name "*.apk" -exec ls -lh {} +
          APK_PATH=$(find android/app/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Packaging APK from $APK_PATH"
          cp "$APK_PATH" Wabi-v1.0.2-HD-Bundle.apk
          cp "$APK_PATH" Wabi-Family-v1.0.2.apk

      - name: Upload Wabi-v1.0.2.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wabi-v1.0.2-APK
          path: |
            Wabi-v1.0.2-HD-Bundle.apk
            Wabi-Family-v1.0.2.apk
          retention-days: 30

      - name: Publish v1.0.2 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: wabi-v1.0.2
          name: "WABI v1.0.2 — HD Video Scrubber & Complete Family Discipline Bundle"
          make_latest: true
          body: |
            ## 🌟 WABI v1.0.2 HD Media Bundle (`Wabi-v1.0.2-HD-Bundle.apk`)

            Ota-ona va farzandlar uchun to'liq video scrubbing, 3D Canvas va ensiklopediyani o'z ichiga olgan to'liq APK:

            ### ✨ Yangiliklar:
            - 📹 **`vibe.mp4` va `wabi.mp4` HD Videolari APK ichiga to'liq joylandi:** Slayder surilganda 1-videodagi kabi frame-accurate video scrubbing va 3D Canvas personaji.
            - 🚀 **`file:///android_asset/www/index.html`** orqali 100% offline va qotmasdan ishlaydi.
            - 📖 **Tarbiya Ensiklopediyasi:** 5 ta katta kategoriya, 40+ to'liq psixologik tahlillar va hayotiy vaziyatlar.
            - 🤝 **Dardkash:** Hissiy AI do'st va maslahatchi.
            - 🛡️ **Instagram & O'yinlar 10-Daqiqa Qoidasi:** `FocusLockAccessibilityService` orqali qattiq bloklash.
            - 🕌 **Namangan Namoz Vaqtlari:** Aladhan API va `AlarmClock` orqali 5 mahal namozga avtomatik budilnik qo'yish.
          files: |
            Wabi-v1.0.2-HD-Bundle.apk
            Wabi-Family-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
