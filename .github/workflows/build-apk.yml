name: Build Nova-Jarvis APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync NOVA Translucent Overlay Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Translucent Nova Overlay APK (API 26 - API 35)
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Package APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Overlay-v3.4.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Jarvis.apk

      - name: Upload Nova-Overlay-v3.4.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Overlay-v3.4-APK
          path: |
            Nova-Overlay-v3.4.apk
            Nova-Jarvis.apk
          retention-days: 30

      - name: Publish v3.4.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nova-overlay-v3.4.0
          name: "NOVA v3.4.0 — One-Tap Proactive Accessibility Prompt & Auto-Settings Opener"
          make_latest: true
          body: |
            ## 🌌 NOVA v3.4.0 (`Nova-Overlay-v3.4.apk` / `Nova-Jarvis.apk`)

            - ⚡ **Proactive Accessibility Permission Prompts:** If Accessibility is not enabled, NOVA now displays an immediate, beautiful one-tap banner above the Orb to directly open Android's Accessibility Settings page.
            - 🚀 **Zero-Confusion Auto-Navigator:** If you say *"plusga kir Jamshidga yoz"* before granting Accessibility, NOVA speaks aloud and opens the settings directly: *"Bro, Telegramda odamga avtomatik kirishim uchun Maxsus imkoniyatlar (Accessibility) ruxsatini yoqishing kerak, hozir ochyapman!"*.
            - 🔄 **Auto-Resume & Detection:** As soon as you toggle on NOVA Accessibility and return to the app, the banner dismisses automatically with full automation unlocked.
          files: |
            Nova-Overlay-v3.4.apk
            Nova-Jarvis.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
