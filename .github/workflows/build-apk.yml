name: Build WABI Family & Discipline APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync WABI Web Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build WABI APK (API 26 - API 35)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Package APK Files
        run: |
          find android/app/build/outputs -name "*.apk" -exec ls -lh {} +
          APK_PATH=$(find android/app/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Packaging APK from $APK_PATH"
          cp "$APK_PATH" Wabi-Family.apk
          cp "$APK_PATH" Wabi-v1.0.apk

      - name: Upload Wabi-Family.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wabi-Family-APK
          path: |
            Wabi-Family.apk
            Wabi-v1.0.apk
          retention-days: 30

      - name: Publish v1.0.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: wabi-v1.0.0
          name: "WABI v1.0.0 — Smart Family Discipline & Focus Ecosystem"
          make_latest: true
          body: |
            ## 🌟 WABI v1.0.0 (`Wabi-Family.apk` / `Wabi-v1.0.apk`)

            Ota-ona va farzandlar uchun "Oila & Intizom" (Smart Discipline & Focus Ecosystem) — 0% Mock / 100% Realtime:

            ### ✨ Asosiy Imkoniyatlar:
            - 🔮 **"Meet Wabi" Liquid Glass Lens Swipe:** WebGL qavariq shisha linzasi, ranglar sinishi (Chromatic Aberration) va 2D fizika pufakchalari otilib chiqishi.
            - 🧸 **"What's Your Vibe Today?" 3D Paxmoq Personaj:** 60 FPS procedural fur shell rendering, kayfiyatga qarab yashil/olovrang/qizil rangga va ko'z morfingiga ega.
            - 👑 **Dual Role Tizimi:** Ota-ona (Parent) va Farzand (Kid) rejimlari 6 xonali oila kodi orqali real vaqtda bog'lanadi.
            - 🛡️ **Haqiqiy Android Nazorati:** `UsageStatsManager` va `AccessibilityService` orqali Instagram/o'yinlar limiti tugashi bilan "Warm Espresso Focus Lock" ekrani bilan bloklash.
            - 🕌 **Namangan Namoz Vaqtlari:** Aladhan API va `AlarmManager` orqali avtomatik 5 mahal namoz eslatmalari.
          files: |
            Wabi-Family.apk
            Wabi-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
