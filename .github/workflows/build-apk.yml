name: Build Nova-Jarvis APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync NOVA Translucent Overlay Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Translucent Nova Overlay APK (API 26 - API 35)
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Package APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Overlay-v3.1.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Jarvis.apk

      - name: Upload Nova-Overlay-v3.1.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Overlay-v3.1-APK
          path: |
            Nova-Overlay-v3.1.apk
            Nova-Jarvis.apk
          retention-days: 30

      - name: Publish v3.1.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nova-overlay-v3.1.0
          name: "NOVA v3.1.0 — 100% Native SpeechRecognizer + Edge Glow + Spring 3D Plasma Sphere"
          make_latest: true
          body: |
            ## 🌌 NOVA v3.1.0 (`Nova-Overlay-v3.1.apk` / `Nova-Jarvis.apk`)

            - **100% Native Android `SpeechRecognizer` (`MainActivity.java`):** Orqa fondagi mikrofon band qilish olib tashlandi; real-vaqtda `window.onNativeSpeech(text, isFinal)` va `window.onVoiceLevel(rmsdB)` ishlaydi.
            - **Zero Grey Box:** Zerikarli kulrang xato qutisi va ikkinchi klaviatura tugmasi butunlay olib tashlandi.
            - **Spring Slide-Up + 4-Sided Edge Glow + 3D Liquid Plasma Sphere:** Ilova ochilganda 4 ta chet bo'ylab ko'k-firuza neon nur (Edge Glow) va pastdan `cubic-bezier(0.22, 1, 0.36, 1)` spring animatsiyasi bilan 3D Suyuq Plazma Sferasi suzib chiqadi.
            - **Blur-Fade Jonli Yozuv & Glassmorphic AI Kapsula:** Gapirayotganda so'zlar sfera tepasida qutisiz, shaffof fonda neon-oq harflar bilan yoziladi; faqat AI javob berganda shaffof-shisha (dark glassmorphism) kapsula silliq kengayib ochiladi.
          files: |
            Nova-Overlay-v3.1.apk
            Nova-Jarvis.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
