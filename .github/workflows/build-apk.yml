name: Build Nova-Jarvis APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync NOVA Zero-UI Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Nova-Jarvis APK (API 26 - API 35)
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Package Nova-Jarvis.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Jarvis.apk

      - name: Upload Nova-Jarvis.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Jarvis-APK
          path: |
            Nova-Jarvis.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish Nova-Jarvis.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nova-jarvis-v2.0.0
          name: "NOVA (Nova-Jarvis.apk) v2.0.0 — Autonomous AI Assistant & Digital Twin"
          body: |
            ## 🌌 NOVA (`Nova-Jarvis.apk`) — Zero-UI Autonomous AI & Digital Twin (API 26 – API 35)

            - **Zero-UI 60/120 FPS Orb Engine:** 4 ta jonli FFT skin (`Nova Cyan Ring`, `Solar Eclipse`, `Quantum Particle Sphere`, `Violet Aura`) + Bixby-uslubidagi Compact Bottom Pill rejimi + 1.5s Long-Press / 2-barmoq swipe orqali ochiluvchi yashirin **Nova Studio**.
            - **Voice Biometrics & Anti-Bixby Semantic VAD:** 3 namuna orqali ovoz egasini tanish + gap bog'lovchilar bilan (`va`, `keyin`, `yani`, `lekin`, `haligi...`) tugaganda 3.8 soniyagacha fikr tugashini kutish.
            - **Lock-Screen Auto-Unlock Engine:** Ekran qulflangan paytda "Hey Nova, qulfni och" buyrug'i orqali PIN/parolni avtomatik terib ochish.
            - **6-Gudok Call Secretary & Relationship Matrix:** 6 ta chaqiruvdan so'ng 7-gudokda avtomatik ko'tarib, Ota-Ona/Bobo-Buviga sizlab va ehtirom bilan, Ustozga rasmiy, Do'stlarga samimiy `"bro"` ohangida, Begonaga tekshiruvchi ohangda jonli gaplashish va yozib olish.
            - **Telegram Plus (`org.telegram.plus`) & Ghost Twin:** Orqa fonda Notification `RemoteInput`, Accessibility UI avto-yozish va MTProto Userbot.
            - **Focus Guardian & 5-Mahal Namoz Budilnigi:** Instagramda 10 daqiqadan ko'p o'tirilsa ovozli ogohlantirish bilan yopish va 30 daqiqa bloklash + 5 mahal namoz vaqtlariga avtomatik tizim budilnigi (`EXTRA_SKIP_UI`).
          files: |
            Nova-Jarvis.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
