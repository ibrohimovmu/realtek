name: Build Nova-Jarvis APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync NOVA Translucent Overlay Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Translucent Nova Overlay APK (API 26 - API 35)
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Package APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Overlay-v3.3.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Jarvis.apk

      - name: Upload Nova-Overlay-v3.3.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Overlay-v3.3-APK
          path: |
            Nova-Overlay-v3.3.apk
            Nova-Jarvis.apk
          retention-days: 30

      - name: Publish v3.3.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nova-overlay-v3.3.0
          name: "NOVA v3.3.0 — Snappy Silence, Thin Cyber Rim, Human Speech & Telegram Plus Chat Navigation"
          make_latest: true
          body: |
            ## 🌌 NOVA v3.3.0 (`Nova-Overlay-v3.3.apk` / `Nova-Jarvis.apk`)

            - ⚡ **Snappy Silence Detector:** Reduced delay from 3.2s to 1.4s (and 2.1s for trailing conjunctions "va", "keyin", "lekin"). Fast, responsive and never feels frozen!
            - 💎 **Ultra-Thin Cyber Neon Edge Rim:** Replaced heavy inset shadow with an ultra-sleek 1.5px cyber neon border line with 4 corner brackets (Gemini Live style) and subtle luminous sheen.
            - 🗣️ **Natural Human Speech & Digital Twin Persona:** High-quality voice selection, pitch 1.05 / speech rate 1.03 for lively, natural cadence, and conversational "bro / do'stim" responses.
            - ✈️ **Telegram Plus Contact Auto-Navigation:** Now automatically handles commands like *"plusga kir Jamshidga yoz"* or *"Jamshidga salom deb yoz"* — opens Telegram Plus, taps search, types recipient name, and enters their chat!
          files: |
            Nova-Overlay-v3.3.apk
            Nova-Jarvis.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
