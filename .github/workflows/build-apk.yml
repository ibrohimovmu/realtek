name: Build AURA Music APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync AURA Web Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build AURA Music APK (API 26 - API 35)
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace > ../gradle-output.txt 2>&1 || true

      - name: Always Upload Gradle Output
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output
          path: gradle-output.txt

      - name: Verify Build Succeeded
        run: |
          if ! grep -q "BUILD SUCCESSFUL" gradle-output.txt; then
            echo "Gradle failed!"
            exit 1
          fi

      - name: Package APK Files
        run: |
          find android/app/build/outputs -name "*.apk" -exec ls -lh {} +
          APK_PATH=$(find android/app/build/outputs -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Packaging APK from $APK_PATH"
          cp "$APK_PATH" Aura-Music.apk
          cp "$APK_PATH" Aura-v1.0.apk

      - name: Upload Aura-Music.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-APK
          path: |
            Aura-Music.apk
            Aura-v1.0.apk
          retention-days: 30

      - name: Publish v1.0.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: aura-v1.0.0
          name: "AURA v1.0.0 — Next-Gen Ambient & 3D Vinyl Music Player"
          make_latest: true
          body: |
            ## 🎵 AURA v1.0.0 (`Aura-Music.apk` / `Aura-v1.0.apk`)

            The next-generation Ambient & 3D Vinyl Music Player for Android (API 26 to API 35):

            ### 🌟 Key Highlights:
            - 💿 **Interactive 3D Vinyl Turntable:** Photorealistic rotating vinyl with moving mechanical tonearm (needle arm) that automatically drops onto the vinyl on play and lifts off on pause. Plus interactive DJ scratch touch scrub!
            - 🎨 **Dynamic Ambient Mesh Glow:** Background colors morph smoothly matching the album artwork.
            - 📊 **60/120 FPS Live Spectrum Visualizer:** Additive-blended neon waveform reacting in real-time to audio amplitude and bass frequencies.
            - 🔒 **Dual Lockscreen Experience:** Native Android 11-15 lock screen notification with media controls + optional AURA Ambient Lockscreen mode (`SHOW_WHEN_LOCKED`).
            - 🎛️ **5-Band Hardware Equalizer & 3D Bass Boost:** Custom presets for deep bass, rock, synthwave, and vocals.
            - 📁 **Automated Local Storage Scanner:** Scans and indexes all MP3, FLAC, M4A, WAV audio files on device with instant search.
            - 🌙 **Sleep Timer with Smooth Fade-Out:** 15, 30, 45, 60 minutes with smooth volume decline.
          files: |
            Aura-Music.apk
            Aura-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
