name: Build Nova-Jarvis APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync NOVA Translucent Overlay Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Translucent Nova Overlay APK (API 26 - API 35)
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Package APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Overlay-v3.0.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Jarvis.apk

      - name: Upload Nova-Overlay-v3.0.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Overlay-v3.0-APK
          path: |
            Nova-Overlay-v3.0.apk
            Nova-Jarvis.apk
          retention-days: 30

      - name: Publish v3.0.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nova-overlay-v3.0.0
          name: "NOVA v3.0.0 — 100% Shaffof (Translucent) Bixby Mini Card & Gemini Live Edge Overlay"
          make_latest: true
          body: |
            ## 🌌 NOVA v3.0.0 (`Nova-Overlay-v3.0.apk` / `Nova-Jarvis.apk`) — 100% Translucent Compact Overlay

            - **100% Shaffof Oyna (`Theme.Translucent.NoTitleBar` + `Color.TRANSPARENT`):** Ekranning yuqori 75% qismi to'liq shaffof — orqadagi telefon ekrani (launcher va ilovalar) ko'rinib turadi, tepaga bosganda overlay yopiladi.
            - **Rejim A (Bixby Mini Card):** Pastki markazda `68x68px` 3D suyuq ko'k-firuza sfera + ixcham xira-shaffof kartochka (`⚙️` sozlamalar va `⌨️` klaviatura tugmalari bilan).
            - **Rejim B (Gemini Live Edge Glow):** Ekranning 4 ta cheti bo'ylab ko'k-firuza neon nur (Edge Glow), pastki ko'k zarralar (particle mist), `"Share screen with Live"` va pastki yumaloq kapsula.
            - **Haqiqiy Ovoz (3.5s Pauza Kutish) & Qurilma Boshqaruvi:** Gemini API + Groq API haqiqiy `fetch`, `PackageManager` orqali ilovalarni ochish (*"Telegram Plus'ni och"*, *"Instagramni och"*), `AlarmClock` budilnik va `NovaAccessibilityService`.
          files: |
            Nova-Overlay-v3.0.apk
            Nova-Jarvis.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
