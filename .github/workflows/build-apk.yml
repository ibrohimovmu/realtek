name: Build Nova-Jarvis APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync NOVA Translucent Overlay Assets to Android Bundle
        run: |
          npm run sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Translucent Nova Overlay APK (API 26 - API 35)
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Package APK Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Overlay-v3.2.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Nova-Jarvis.apk

      - name: Upload Nova-Overlay-v3.2.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Overlay-v3.2-APK
          path: |
            Nova-Overlay-v3.2.apk
            Nova-Jarvis.apk
          retention-days: 30

      - name: Publish v3.2.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: nova-overlay-v3.2.0
          name: "NOVA v3.2.0 — Unblocked Native Mic & Multi-Engine SpeechRecognizer"
          make_latest: true
          body: |
            ## 🌌 NOVA v3.2.0 (`Nova-Overlay-v3.2.apk` / `Nova-Jarvis.apk`)

            - **Unblocked Direct Mic Permissions:** Removed blocking SharedPreferences flag so RECORD_AUDIO is directly requested and granted on any device.
            - **Google Recognition Service Engine Matcher:** Resolves Samsung Galaxy voice issue by auto-selecting Google Speech Engine (`com.google.android.googlequicksearchbox`) with multi-language fallback (`uz-UZ`, `ru-RU`, `en-US`).
            - **Live Status Feedback:** Sleek pulsing hint *"Eshitmoqdaman..."* appears immediately so user always knows the mic is active; transitions seamlessly to blur-fade neon words as you speak.
          files: |
            Nova-Overlay-v3.2.apk
            Nova-Jarvis.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
